services:
  plex:
    image: plexinc/pms-docker:1.43.5.11079-b3b13e506-amd64
    container_name: plex
    hostname: plex.ctr.xbhl.intranet
    networks:
      - proxy
    environment:
      - PLEX_UID=1000
      - PLEX_GID=100
      - TZ=Europe/Warsaw
      - VERSION=docker
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - PLEX_CLAIM=${PLEX_CLAIM:?err}
      - ADVERTISE_IP=https://${PLEX_DOMAIN:?err}:443/
    tmpfs:
      - /transcode:rw,size=16G,mode=1777
    volumes:
      - config:/config
      - torrent:/torrent
      - movies:/multimedia/movies
      - tv:/multimedia/tv
      - music:/multimedia/music
      - photos:/multimedia/photos
      - other:/multimedia/other
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.plex-router.rule=Host(`${PLEX_DOMAIN:?err}`)"
      - "traefik.http.routers.plex-router.entrypoints=websecure"
      - "traefik.http.routers.plex-router.tls=true"
      - "traefik.http.routers.plex-router.service=plex"
      - "traefik.http.routers.plex-transcode-router.rule=Host(`${PLEX_DOMAIN:?err}`) && (PathPrefix(`/video/:/transcode/universal/decision`) || PathPrefix(`/video/:/transcode/universal/start`))"
      - "traefik.http.routers.plex-transcode-router.entrypoints=websecure"
      - "traefik.http.routers.plex-transcode-router.tls=true"
      - "traefik.http.routers.plex-transcode-router.middlewares=plex-strip-transcode-params,plex-force-direct-play,plex-force-direct-stream,plex-force-subtitles-auto"
      - "traefik.http.routers.plex-transcode-router.service=plex"
      - "traefik.http.middlewares.plex-strip-transcode-params.plugin.query-modification.type=delete"
      - 'traefik.http.middlewares.plex-strip-transcode-params.plugin.query-modification.paramNameRegex=^(directPlay|directStream|subtitles)$$'
      - "traefik.http.middlewares.plex-force-direct-play.plugin.query-modification.type=add"
      - "traefik.http.middlewares.plex-force-direct-play.plugin.query-modification.paramName=directPlay"
      - "traefik.http.middlewares.plex-force-direct-play.plugin.query-modification.newValue=0"
      - "traefik.http.middlewares.plex-force-direct-stream.plugin.query-modification.type=add"
      - "traefik.http.middlewares.plex-force-direct-stream.plugin.query-modification.paramName=directStream"
      - "traefik.http.middlewares.plex-force-direct-stream.plugin.query-modification.newValue=0"
      - "traefik.http.middlewares.plex-force-subtitles-auto.plugin.query-modification.type=add"
      - "traefik.http.middlewares.plex-force-subtitles-auto.plugin.query-modification.paramName=subtitles"
      - "traefik.http.middlewares.plex-force-subtitles-auto.plugin.query-modification.newValue=auto"
      - "traefik.http.services.plex.loadbalancer.server.port=32400"
      - "traefik.docker.network=proxy"
      - 'wud.watch=true'
      - 'wud.tag.include=^\d+\.\d+\.\d+\.\d+-[a-f0-9]+-amd64$$'
      - 'wud.tag.transform=^(\d+)\.(\d+)\.(\d+)\.(\d+)-(.*) => $$1.$$2.$$4'
      - "wud.link.template=https://forums.plex.tv/t/plex-media-server/30447/last"
    restart: unless-stopped

volumes:
  config:
    driver: local

  torrent:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /share/Media/Torrent
  movies:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /share/Media/Movies
  tv:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /share/Media/TV
  music:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /share/Media/Music
  photos:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /share/Media/Photos
  other:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /share/Media/Other

networks:
  proxy:
    external: true
